; EMGTRAINNER — puente uMyo (BLE) -> Serial
;
; Proyecto PlatformIO autocontenido: la libreria uMyo_BLE va incluida en lib/,
; asi que no depende del registro ni de versiones que cambien con el tiempo.
;
; Uso:
;   pio run -t upload -e esp32s3
;   pio device monitor -e esp32s3
;
; Si cambias de placa, haz SIEMPRE `pio run -t fullclean` antes de recompilar:
; los artefactos de otra arquitectura provocan errores raros del tipo
; "src/xxx.ino.cpp: No such file or directory".

[env:esp32s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

; La placa se conecta por su puente USB-UART (CH343/CP210x), no por el USB
; nativo del chip. Con ARDUINO_USB_CDC_ON_BOOT=1 el objeto Serial saldria por
; el USB nativo y el puerto COM del puente no mostraria nada, aunque el
; firmware estuviera corriendo bien.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Debe coincidir con SerialManager(baudrate=...) en backend/core/serial/manager.py

monitor_speed = 921600
upload_speed = 921600

; Descomenta y ajusta si la autodeteccion elige el puerto equivocado.
; Ojo: el U2D2 de la mano Dynamixel (FTDI) aparece como "USB Serial Port (COMx)"
; y es facil confundirlo con la placa.
; upload_port = COM10
; monitor_port = COM10

lib_deps =
    ArduinoBLE
